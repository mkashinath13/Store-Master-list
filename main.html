<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Master List Entry</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 650px;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
            font-size: 24px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
        }
        input, select {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: #3498db;
        }
        button {
            grid-column: span 2;
            background-color: #3498db;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        #status-message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Material Entry Form</h2>
        <form id="materialForm">
            <div class="form-grid">
                
                <div class="form-group">
                    <label for="kindOfMaterial">Kind of Material</label>
                    <select id="kindOfMaterial" required>
                        <option value="">Select Material</option>
                        <option value="Electrical">Electrical</option>
                        <option value="Plumbing">Plumbing</option>
                        <option value="HVAC">HVAC</option>
                        <option value="Civil">Civil</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="makeOrSupplier">Make or Supplier</label>
                    <select id="makeOrSupplier" required>
                        <option value="">Select Supplier</option>
                        <option value="Supplier A">Supplier A</option>
                        <option value="Supplier B">Supplier B</option>
                        <option value="Supplier C">Supplier C</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="Enter material description" required>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label for="unit">Unit</label>
                    <select id="unit" required>
                        <option value="">Select Unit</option>
                        <option value="Pcs">Pcs</option>
                        <option value="Nos">Nos</option>
                        <option value="Mtrs">Mtrs</option>
                        <option value="Boxes">Boxes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="lpo1">LPO #1</label>
                    <input type="text" id="lpo1" placeholder="LPO #1">
                </div>

                <div class="form-group">
                    <label for="lpo2">LPO #2</label>
                    <input type="text" id="lpo2" placeholder="LPO #2">
                </div>

                <div class="form-group">
                    <label for="dn1">DN #1</label>
                    <input type="text" id="dn1" placeholder="DN #1">
                </div>

                <div class="form-group">
                    <label for="dn2">DN #2</label>
                    <input type="text" id="dn2" placeholder="DN #2">
                </div>

                <div class="form-group">
                    <label for="lposQty">LPOs QTY</label>
                    <input type="number" step="any" id="lposQty" placeholder="0">
                </div>

                <div class="form-group">
                    <label for="floor">Floor</label>
                    <select id="floor">
                        <option value="">Select Floor</option>
                        <option value="Ground Floor">Ground Floor</option>
                        <option value="1st Floor">1st Floor</option>
                        <option value="2nd Floor">2nd Floor</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="shelfNo">Shelf No.</label>
                    <input type="text" id="shelfNo" placeholder="Shelf No">
                </div>

                <div class="form-group">
                    <label for="rack">Rack</label>
                    <input type="text" id="rack" placeholder="Rack">
                </div>

                <div class="form-group">
                    <label for="inQty">IN (Qty)</label>
                    <input type="number" step="any" id="inQty" value="0">
                </div>

                <div class="form-group">
                    <label for="outQty">OUT (Qty)</label>
                    <input type="number" step="any" id="outQty" value="0">
                </div>

                <div class="form-group full-width">
                    <label for="unitPrice">Unit Price</label>
                    <input type="number" step="any" id="unitPrice" placeholder="0.00" required>
                </div>

                <button type="submit" id="submitBtn">Add Entry</button>
            </div>
        </form>
        <div id="status-message"></div>
    </div>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbzeqyb_OGzuQkf_IL1evY-S5aanyAzEbKIq90EZ_rQpx77VYqZUAwOLrka0okexngPfVg/exec"; // <-- Paste your Web App URL here
        const form = document.getElementById("materialForm");
        const statusMessage = document.getElementById("status-message");

        form.addEventListener("submit", e => {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            btn.disabled = true;
            btn.textContent = "Submitting...";
            statusMessage.style.color = "#3498db";
            statusMessage.textContent = "Sending data to Google Sheets...";

            const formData = {
                kindOfMaterial: document.getElementById("kindOfMaterial").value,
                description: document.getElementById("description").value,
                makeOrSupplier: document.getElementById("makeOrSupplier").value,
                date: document.getElementById("date").value,
                lpo1: document.getElementById("lpo1").value,
                lpo2: document.getElementById("lpo2").value,
                dn1: document.getElementById("dn1").value,
                dn2: document.getElementById("dn2").value,
                lposQty: document.getElementById("lposQty").value,
                unit: document.getElementById("unit").value,
                floor: document.getElementById("floor").value,
                shelfNo: document.getElementById("shelfNo").value,
                rack: document.getElementById("rack").value,
                inQty: document.getElementById("inQty").value,
                outQty: document.getElementById("outQty").value,
                unitPrice: document.getElementById("unitPrice").value
            };

            fetch(scriptURL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(result => {
                statusMessage.style.color = "#27ae60";
                statusMessage.textContent = "Entry added successfully!";
                form.reset();
                btn.disabled = false;
                btn.textContent = "Add Entry";
                setTimeout(() => statusMessage.textContent = "", 4000);
            })
            .catch(error => {
                console.error("Error!", error);
                statusMessage.style.color = "#e74c3c";
                statusMessage.textContent = "Failed to submit. Please try again.";
                btn.disabled = false;
                btn.textContent = "Add Entry";
            });
        });
    </script>
</body>
</html>
